name: Seal Tests

on:
  push:
    branches: [main, master, "litellm_internal_staging"]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install poetry
          make install-test-deps
      - name: Run unit tests
        run: |
          IGNORE_ARGS=""
          if [[ "${{ matrix.python-version }}" == "3.10" || "${{ matrix.python-version }}" == "3.11" ]]; then
            IGNORE_ARGS="--ignore=tests/test_litellm/containers"
          fi
          poetry run pytest tests/test_litellm -vv -n 4 $IGNORE_ARGS

  check-circular-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install poetry
          make install-dev
      - name: Check circular imports
        run: make check-circular-imports
      - name: Check import safety
        run: make check-import-safety
